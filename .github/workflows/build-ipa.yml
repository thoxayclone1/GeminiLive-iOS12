name: Build GeminiLive iOS 12 IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate AppIcon Assets
        run: |
          ICON_SET="Sources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_SET"

          # Nếu bạn chưa tải file icon.png lên repo, tự động vẽ Icon Quả cầu Gemini Live 1024x1024
          if [ ! -f "icon.png" ]; then
            cat << 'EOF' > make_icon.swift
          import AppKit

          let size = CGSize(width: 1024, height: 1024)
          let rep = NSBitmapImageRep(
              bitmapDataPlanes: nil,
              pixelsWide: Int(size.width),
              pixelsHigh: Int(size.height),
              bitsPerSample: 8,
              samplesPerPixel: 4,
              hasAlpha: true,
              isPlanar: false,
              colorSpaceName: .deviceRGB,
              bytesPerRow: 0,
              bitsPerPixel: 0
          )!

          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
          let ctx = NSGraphicsContext.current!.cgContext
          let colorSpace = CGColorSpaceCreateDeviceRGB()

          // 1. Nền vũ trụ tối
          let bgColors = [
              CGColor(red: 0.03, green: 0.04, blue: 0.09, alpha: 1.0),
              CGColor(red: 0.08, green: 0.06, blue: 0.18, alpha: 1.0)
          ] as CFArray
          let bgGrad = CGGradient(colorsSpace: colorSpace, colors: bgColors, locations: [0.0, 1.0])!
          ctx.drawLinearGradient(bgGrad, start: CGPoint(x: 0, y: 1024), end: CGPoint(x: 1024, y: 0), options: [])

          // 2. Hào quang phát sáng xung quanh Quả cầu
          let center = CGPoint(x: 512, y: 512)
          let glowColors = [
              CGColor(red: 0.22, green: 0.56, blue: 0.98, alpha: 0.55),
              CGColor(red: 0.58, green: 0.32, blue: 0.92, alpha: 0.25),
              CGColor(red: 0.04, green: 0.04, blue: 0.10, alpha: 0.0)
          ] as CFArray
          let glowGrad = CGGradient(colorsSpace: colorSpace, colors: glowColors, locations: [0.0, 0.55, 1.0])!
          ctx.drawRadialGradient(glowGrad, startCenter: center, startRadius: 60, endCenter: center, endRadius: 460, options: [])

          // 3. Quả cầu trung tâm (3 dải màu Cyan - Indigo - Coral)
          ctx.saveGState()
          let orbRect = CGRect(x: 192, y: 192, width: 640, height: 640)
          ctx.addEllipse(in: orbRect)
          ctx.clip()
          let orbColors = [
              CGColor(red: 0.15, green: 0.80, blue: 0.96, alpha: 1.0),
              CGColor(red: 0.45, green: 0.36, blue: 0.96, alpha: 1.0),
              CGColor(red: 0.92, green: 0.36, blue: 0.56, alpha: 1.0)
          ] as CFArray
          let orbGrad = CGGradient(colorsSpace: colorSpace, colors: orbColors, locations: [0.0, 0.52, 1.0])!
          ctx.drawLinearGradient(orbGrad, start: CGPoint(x: 200, y: 820), end: CGPoint(x: 820, y: 200), options: [])
          ctx.restoreGState()

          // 4. Viền sáng quanh quả cầu
          ctx.setStrokeColor(CGColor(red: 0.78, green: 0.92, blue: 1.0, alpha: 0.65))
          ctx.setLineWidth(10)
          ctx.strokeEllipse(in: orbRect.insetBy(dx: 5, dy: 5))

          // 5. Biểu tượng ngôi sao 4 cánh AI ở chính giữa
          let starPath = CGMutablePath()
          let cx: CGFloat = 512, cy: CGFloat = 512, rOuter: CGFloat = 175, rInner: CGFloat = 45
          starPath.move(to: CGPoint(x: cx, y: cy + rOuter))
          starPath.addQuadCurve(to: CGPoint(x: cx + rOuter, y: cy), control: CGPoint(x: cx + rInner, y: cy + rInner))
          starPath.addQuadCurve(to: CGPoint(x: cx, y: cy - rOuter), control: CGPoint(x: cx + rInner, y: cy - rInner))
          starPath.addQuadCurve(to: CGPoint(x: cx - rOuter, y: cy), control: CGPoint(x: cx - rInner, y: cy - rInner))
          starPath.addQuadCurve(to: CGPoint(x: cx, y: cy + rOuter), control: CGPoint(x: cx - rInner, y: cy + rInner))
          starPath.closeSubpath()

          ctx.setFillColor(CGColor(red: 1.0, green: 1.0, blue: 1.0, alpha: 0.96))
          ctx.addPath(starPath)
          ctx.fillPath()

          NSGraphicsContext.restoreGraphicsState()

          let pngData = rep.representation(using: .png, properties: [:])!
          try! pngData.write(to: URL(fileURLWithPath: "icon.png"))
          EOF
            swift make_icon.swift
            rm -f make_icon.swift
          fi

          # Tự động cắt ra toàn bộ các kích thước chuẩn iOS từ file icon.png
          sips -s format png -z 40 40   icon.png --out "$ICON_SET/Icon-20@2x.png"
          sips -s format png -z 60 60   icon.png --out "$ICON_SET/Icon-20@3x.png"
          sips -s format png -z 58 58   icon.png --out "$ICON_SET/Icon-29@2x.png"
          sips -s format png -z 87 87   icon.png --out "$ICON_SET/Icon-29@3x.png"
          sips -s format png -z 80 80   icon.png --out "$ICON_SET/Icon-40@2x.png"
          sips -s format png -z 120 120 icon.png --out "$ICON_SET/Icon-40@3x.png"
          sips -s format png -z 120 120 icon.png --out "$ICON_SET/Icon-60@2x.png"
          sips -s format png -z 180 180 icon.png --out "$ICON_SET/Icon-60@3x.png"
          sips -s format png -z 1024 1024 icon.png --out "$ICON_SET/Icon-1024.png"

          cat << 'EOF' > "$ICON_SET/Contents.json"
          {
            "images" : [
              { "idiom" : "iphone", "size" : "20x20", "scale" : "2x", "filename" : "Icon-20@2x.png" },
              { "idiom" : "iphone", "size" : "20x20", "scale" : "3x", "filename" : "Icon-20@3x.png" },
              { "idiom" : "iphone", "size" : "29x29", "scale" : "2x", "filename" : "Icon-29@2x.png" },
              { "idiom" : "iphone", "size" : "29x29", "scale" : "3x", "filename" : "Icon-29@3x.png" },
              { "idiom" : "iphone", "size" : "40x40", "scale" : "2x", "filename" : "Icon-40@2x.png" },
              { "idiom" : "iphone", "size" : "40x40", "scale" : "3x", "filename" : "Icon-40@3x.png" },
              { "idiom" : "iphone", "size" : "60x60", "scale" : "2x", "filename" : "Icon-60@2x.png" },
              { "idiom" : "iphone", "size" : "60x60", "scale" : "3x", "filename" : "Icon-60@3x.png" },
              { "idiom" : "ios-marketing", "size" : "1024x1024", "scale" : "1x", "filename" : "Icon-1024.png" }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          EOF

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' -E 's/objectVersion = [0-9]+/objectVersion = 56/' GeminiLive.xcodeproj/project.pbxproj

      - name: Build Unsigned Archive for iOS 12 (arm64)
        run: |
          xcodebuild clean archive \
            -project GeminiLive.xcodeproj \
            -scheme GeminiLive \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/GeminiLive.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa for Sideloadly
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/GeminiLive.xcarchive/Products/Applications/GeminiLive.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r9 GeminiLive-iOS12.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLive-iOS12-IPA
          path: ${{ runner.temp }}/GeminiLive-iOS12.ipa
